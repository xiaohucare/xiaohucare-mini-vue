<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- AI 机器人图标 -->
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67C23A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 头部 -->
  <rect x="312" y="200" width="400" height="300" rx="40" ry="40" fill="url(#aiGradient)"/>
  
  <!-- 眼睛 -->
  <circle cx="420" cy="320" r="40" fill="white"/>
  <circle cx="604" cy="320" r="40" fill="white"/>
  <circle cx="420" cy="320" r="20" fill="#409EFF"/>
  <circle cx="604" cy="320" r="20" fill="#409EFF"/>
  
  <!-- 天线 -->
  <line x1="512" y1="200" x2="512" y2="120" stroke="url(#aiGradient)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="512" cy="120" r="24" fill="url(#aiGradient)"/>
  
  <!-- 身体 -->
  <rect x="352" y="540" width="320" height="280" rx="30" ry="30" fill="url(#aiGradient)"/>
  
  <!-- 胸部屏幕 -->
  <rect x="402" y="590" width="220" height="120" rx="15" ry="15" fill="white"/>
  
  <!-- 屏幕上的文字 AI -->
  <text x="512" y="670" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#409EFF" text-anchor="middle">AI</text>
  
  <!-- 手臂 -->
  <rect x="252" y="580" width="80" height="200" rx="40" ry="40" fill="url(#aiGradient)"/>
  <rect x="692" y="580" width="80" height="200" rx="40" ry="40" fill="url(#aiGradient)"/>
  
  <!-- 底座 -->
  <rect x="392" y="840" width="240" height="40" rx="20" ry="20" fill="url(#aiGradient)"/>
</svg>
