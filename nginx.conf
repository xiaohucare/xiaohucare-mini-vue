# nginx 部署示例：将前端部署到二级目录 /xiaohucare/
# 与 vite.config.js 的 base（生产 /xiaohucare/）和 .env.production 的 VITE_APP_BASE_API（/xiaohucare-api）保持一致
server {
    listen 80;
    # TODO: 替换为你的域名
    server_name your-domain.com;

    # 静态资源根目录
    root /usr/share/nginx/html;

    # 前端二级目录
    location /xiaohucare/ {
        # 指向打包后的 dist 目录内容
        alias /usr/share/nginx/html/xiaohucare/;
        # 支持 HTML5 History 模式回退
        try_files $uri $uri/ /xiaohucare/index.html;
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 默认重定向到 /xiaohucare/
    location / {
        return 301 /xiaohucare/;
    }

    # 后端 API 代理：把 VITE_APP_BASE_API 反代到后端，并去掉前缀
    location /xiaohucare-api/ {
        # TODO: 替换为你的后端地址与端口；末尾斜杠用于剥掉 /xiaohucare-api 前缀
        proxy_pass http://127.0.0.1:8187/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
